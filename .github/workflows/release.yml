name: Release

on:
  push:
    branches:
      - develop
      # Release branches must be named exactly release-X.Y.Z.
      - release-*
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release-') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Get toolchain versions
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          set -euo pipefail
          swift build -v

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme DiveKit \
            -destination 'platform=macOS' \
            -testPlan DiveKit

      - name: Run iOS tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme DiveKit \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -testPlan DiveKit

  release:
    needs: verify
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release-') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Install jq
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Read and validate version
        id: version
        run: |
          set -euo pipefail

          VERSION_FILE="version.json"
          RELEASE_BRANCH_REGEX='^release-[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ ! -f "$VERSION_FILE" ]]; then
            echo "Missing required file: $VERSION_FILE"
            exit 1
          fi

          if ! FILE_VERSION=$(jq -re '.version | select(type == "string" and length > 0)' "$VERSION_FILE"); then
            echo "$VERSION_FILE must contain a non-empty string .version field"
            exit 1
          fi

          if ! [[ "$FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version in $VERSION_FILE: $FILE_VERSION"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RELEASE_BRANCH="${{ github.event.pull_request.head.ref }}"
          elif [[ "${GITHUB_REF_NAME}" == release-* ]]; then
            RELEASE_BRANCH="${GITHUB_REF_NAME}"
          else
            RELEASE_BRANCH=""
          fi

          if [[ -n "$RELEASE_BRANCH" ]]; then
            if ! [[ "$RELEASE_BRANCH" =~ $RELEASE_BRANCH_REGEX ]]; then
              echo "Invalid release branch name: $RELEASE_BRANCH"
              echo "Expected format: release-X.Y.Z"
              exit 1
            fi

            BRANCH_VERSION="${RELEASE_BRANCH#release-}"

            if [[ "$BRANCH_VERSION" != "$FILE_VERSION" ]]; then
              echo "Release branch version ($BRANCH_VERSION) does not match $VERSION_FILE ($FILE_VERSION)"
              exit 1
            fi
          fi

          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release type
        id: type
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${GITHUB_REF_NAME}"

            if [[ "$BRANCH" == "develop" ]]; then
              echo "type=beta" >> "$GITHUB_OUTPUT"
            elif [[ "$BRANCH" == release-* ]]; then
              echo "type=rc" >> "$GITHUB_OUTPUT"
            else
              echo "Unsupported branch: $BRANCH"
              exit 1
            fi
          fi

      - name: Determine skip policy
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TYPE: ${{ steps.type.outputs.type }}
          PR_LABELS_JSON: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          set -euo pipefail

          case "$RELEASE_TYPE" in
            beta)
              SKIP_LABEL="skip-beta"
              ;;
            rc)
              SKIP_LABEL="skip-rc"
              ;;
            release)
              SKIP_LABEL="skip-release"
              ;;
            *)
              echo "Unsupported release type: $RELEASE_TYPE"
              exit 1
              ;;
          esac

          SHOULD_SKIP=false
          SKIP_REASON="No matching skip label found."

          has_label() {
            local labels_json="$1"
            jq -e --arg label "$SKIP_LABEL" 'index($label) != null' <<<"$labels_json" >/dev/null
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if has_label "$PR_LABELS_JSON"; then
              SHOULD_SKIP=true
              SKIP_REASON="PR label $SKIP_LABEL is present on #${{ github.event.pull_request.number }}."
            fi
          else
            ASSOCIATED_PRS="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
            )"

            mapfile -t PR_NUMBERS < <(jq -r '.[].number' <<<"$ASSOCIATED_PRS")

            if [[ ${#PR_NUMBERS[@]} -eq 0 ]]; then
              SKIP_REASON="No associated PR found for commit ${GITHUB_SHA}; continuing release flow."
            else
              for PR_NUMBER in "${PR_NUMBERS[@]}"; do
                ISSUE_LABELS_JSON="$(
                  gh api \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}" \
                    --jq '.labels | map(.name)'
                )"

                if has_label "$ISSUE_LABELS_JSON"; then
                  SHOULD_SKIP=true
                  SKIP_REASON="PR #${PR_NUMBER} associated with commit ${GITHUB_SHA} has label ${SKIP_LABEL}."
                  break
                fi
              done

              if [[ "$SHOULD_SKIP" != "true" ]]; then
                SKIP_REASON="Associated PRs for commit ${GITHUB_SHA} do not include label ${SKIP_LABEL}."
              fi
            fi
          fi

          echo "should_skip=$SHOULD_SKIP" >> "$GITHUB_OUTPUT"
          echo "skip_label=$SKIP_LABEL" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$SKIP_REASON" >> "$GITHUB_OUTPUT"
          echo "$SKIP_REASON"

      - name: Skip release flow
        if: steps.skip.outputs.should_skip == 'true'
        run: |
          set -euo pipefail
          echo "${{ steps.skip.outputs.skip_reason }}"

      - name: Resolve tag idempotently
        id: tag
        if: steps.skip.outputs.should_skip != 'true'
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TYPE="${{ steps.type.outputs.type }}"

          git fetch --tags

          if [[ "$TYPE" == "beta" ]]; then
            EXISTING=$(git tag --points-at HEAD -l "${VERSION}-beta.*" | sort -V | tail -1)
            if [[ -n "$EXISTING" ]]; then
              TAG="$EXISTING"
            else
              LAST=$(git tag -l "${VERSION}-beta.*" | awk -F'.beta.' 'NF>1 {print $2}' | sort -n | tail -1)
              LAST=${LAST:-0}
              TAG="${VERSION}-beta.$((LAST + 1))"
            fi
          elif [[ "$TYPE" == "rc" ]]; then
            EXISTING=$(git tag --points-at HEAD -l "${VERSION}-rc.*" | sort -V | tail -1)
            if [[ -n "$EXISTING" ]]; then
              TAG="$EXISTING"
            else
              LAST=$(git tag -l "${VERSION}-rc.*" | awk -F'.rc.' 'NF>1 {print $2}' | sort -n | tail -1)
              LAST=${LAST:-0}
              TAG="${VERSION}-rc.$((LAST + 1))"
            fi
          else
            TAG="${VERSION}"
          fi

          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")

            if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
              echo "Tag $TAG already exists on $TAG_SHA, not on current commit $HEAD_SHA"
              exit 1
            fi

            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Configure SSH signing key
        if: steps.skip.outputs.should_skip != 'true' && steps.tag.outputs.tag_exists != 'true'
        env:
          CI_NAME: ${{ secrets.CI_NAME }}
          CI_EMAIL: ${{ secrets.CI_EMAIL }}
          CI_SSH_PRIVATE_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$CI_NAME" ]]; then
            echo "Missing required secret: CI_NAME"
            exit 1
          fi

          if [[ -z "$CI_EMAIL" ]]; then
            echo "Missing required secret: CI_EMAIL"
            exit 1
          fi

          if [[ -z "$CI_SSH_PRIVATE_KEY" ]]; then
            echo "Missing required secret: CI_SSH_PRIVATE_KEY"
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/ci_signing_key"
          printf '%s\n' "$CI_SSH_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          PUBKEY_PATH="$KEY_PATH.pub"
          if ! ssh-keygen -y -f "$KEY_PATH" > "$PUBKEY_PATH"; then
            echo "CI_SSH_PRIVATE_KEY is not a valid SSH private key or requires a passphrase"
            exit 1
          fi
          chmod 644 "$PUBKEY_PATH"

          eval "$(ssh-agent -s)"
          ssh-add "$KEY_PATH"

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          git config user.name "$CI_NAME"
          git config user.email "$CI_EMAIL"
          git config gpg.format ssh
          git config user.signingkey "$PUBKEY_PATH"
          git config tag.gpgSign true

      - name: Determine notes start tag
        id: notes_base
        if: steps.skip.outputs.should_skip != 'true'
        run: |
          set -euo pipefail

          TAG="${{ steps.tag.outputs.tag }}"
          TYPE="${{ steps.type.outputs.type }}"
          VERSION="${{ steps.version.outputs.version }}"

          git fetch --tags

          previous_matching_tag() {
            local pattern="$1"
            git tag -l "$pattern" | sort -V | awk -v current="$TAG" '$0 != current { last = $0 } END { if (last != "") print last }'
          }

          previous_stable_tag() {
            git tag -l | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print }' | sort -V | awk -v current="$TAG" '$0 != current { last = $0 } END { if (last != "") print last }'
          }

          NOTES_START_TAG=""

          if [[ "$TYPE" == "beta" ]]; then
            NOTES_START_TAG="$(previous_matching_tag "${VERSION}-beta.*")"
            if [[ -z "$NOTES_START_TAG" ]]; then
              NOTES_START_TAG="$(previous_stable_tag)"
            fi
          elif [[ "$TYPE" == "rc" ]]; then
            NOTES_START_TAG="$(previous_matching_tag "${VERSION}-rc.*")"
            if [[ -z "$NOTES_START_TAG" ]]; then
              NOTES_START_TAG="$(previous_matching_tag "${VERSION}-beta.*")"
            fi
            if [[ -z "$NOTES_START_TAG" ]]; then
              NOTES_START_TAG="$(previous_stable_tag)"
            fi
          else
            NOTES_START_TAG="$(previous_stable_tag)"
          fi

          echo "notes_start_tag=$NOTES_START_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved notes start tag: ${NOTES_START_TAG:-<none>}"

      - name: Create signed tag
        if: steps.skip.outputs.should_skip != 'true' && steps.tag.outputs.tag_exists != 'true'
        run: |
          set -euo pipefail

          TAG="${{ steps.tag.outputs.tag }}"
          git tag -s "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create or update GitHub release
        if: steps.skip.outputs.should_skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ steps.tag.outputs.tag }}"
          TYPE="${{ steps.type.outputs.type }}"
          NOTES_START_TAG="${{ steps.notes_base.outputs.notes_start_tag }}"
          NOTES_REQUEST="$(mktemp)"
          NOTES_RESPONSE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          RELEASE_PAYLOAD="$(mktemp)"
          trap 'rm -f "$NOTES_REQUEST" "$NOTES_RESPONSE" "$BODY_FILE" "$RELEASE_PAYLOAD"' EXIT

          if [[ "$TYPE" == "release" ]]; then
            PRERELEASE=false
            MAKE_LATEST=true
          else
            PRERELEASE=true
            MAKE_LATEST=false
          fi

          if [[ -n "$NOTES_START_TAG" ]]; then
            jq -n \
              --arg tag "$TAG" \
              --arg previous_tag "$NOTES_START_TAG" \
              '{tag_name: $tag, previous_tag_name: $previous_tag}' > "$NOTES_REQUEST"
          else
            jq -n --arg tag "$TAG" '{tag_name: $tag}' > "$NOTES_REQUEST"
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --input "$NOTES_REQUEST" > "$NOTES_RESPONSE"

          TITLE="$(jq -re '.name' "$NOTES_RESPONSE")"
          jq -re '.body' "$NOTES_RESPONSE" > "$BODY_FILE"

          jq -n \
            --arg tag "$TAG" \
            --arg name "$TITLE" \
            --rawfile body "$BODY_FILE" \
            --argjson prerelease "$PRERELEASE" \
            --arg make_latest "$MAKE_LATEST" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body,
              prerelease: $prerelease,
              make_latest: $make_latest
            }' > "$RELEASE_PAYLOAD"

          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            RELEASE_ID="$(gh release view "$TAG" --json id -q '.id')"
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --input "$RELEASE_PAYLOAD" >/dev/null
          else
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --input "$RELEASE_PAYLOAD" >/dev/null
          fi
