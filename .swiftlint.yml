included:
  - Package.swift
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - DerivedData
  - Packages

cache_path: .build/swiftlint-cache
strict: true

disabled_rules:
  - switch_case_alignment

line_length:
  warning: 200
  error: 240

type_body_length:
    warning: 400
    error: 450

type_name:
  max_length:
    warning: 60
    error: 80

function_parameter_count:
  warning: 6
  error: 8
